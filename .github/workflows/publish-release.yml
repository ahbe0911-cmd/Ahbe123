name: Publish Rooznegar APK Release

on:
  push:
    paths:
      - '.github/workflows/publish-release.yml'
      - 'release-trigger.txt'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.head_ref == 'release-rooznegar-v0.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release_asset
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9419249491/zip" \
            -o artifact.zip
          unzip -o artifact.zip -d release_asset
          ls -lah release_asset
          test -f release_asset/Rooznegar-redesign-v0.2.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view rooznegar-v0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload rooznegar-v0.2 release_asset/Rooznegar-redesign-v0.2.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create rooznegar-v0.2 release_asset/Rooznegar-redesign-v0.2.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Rooznegar v0.2 Redesign" \
              --notes "Redesigned debug APK with Vazirmatn typography and performance improvements."
          fi
