name: OmniBox Android APK

on:
  push:
    branches: ["dasteyar-apk-build"]
    paths:
      - "dasteyar-build/**"
      - ".github/workflows/dasteyar-apk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build OmniBox debug APK
        working-directory: dasteyar-build
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p output
          cp dasteyar-build/app/build/outputs/apk/debug/app-debug.apk output/OmniBox-v1.5.0-ultra.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniBox-v1.5.0-ultra
          path: output/OmniBox-v1.5.0-ultra.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: OmniBox-source-v1.5.0
          path: |
            dasteyar-build/**
            !dasteyar-build/**/build/**
          if-no-files-found: error
          retention-days: 7
