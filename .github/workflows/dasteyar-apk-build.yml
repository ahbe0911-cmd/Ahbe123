name: DasteYar Android APK

on:
  push:
    branches: ["dasteyar-apk-build"]
    paths:
      - "dasteyar-build/**"
      - ".github/workflows/dasteyar-apk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: dasteyar-build
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DasteYar-debug-apk
          path: dasteyar-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
