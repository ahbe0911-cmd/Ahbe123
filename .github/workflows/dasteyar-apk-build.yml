name: OmniBox Performance APK

on:
  push:
    branches: ["dasteyar-apk-build"]
    paths:
      - "dasteyar-build/**"
      - ".github/workflows/dasteyar-apk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Bundle Vazirmatn locally
        run: |
          mkdir -p dasteyar-build/app/src/main/res/font
          curl -L --fail --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf" \
            -o dasteyar-build/app/src/main/res/font/vazirmatn.ttf
          test -s dasteyar-build/app/src/main/res/font/vazirmatn.ttf

      - name: Build OmniBox performance APK
        working-directory: dasteyar-build
        run: gradle :app:assemblePerformance --stacktrace --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output
          cp dasteyar-build/app/build/outputs/apk/performance/app-performance.apk output/OmniBox-v1.6.0-performance.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniBox-v1.6.0-performance
          path: output/OmniBox-v1.6.0-performance.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: OmniBox-source-v1.6.0
          path: |
            dasteyar-build/**
            !dasteyar-build/**/build/**
          if-no-files-found: error
          retention-days: 7
