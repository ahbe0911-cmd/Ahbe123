name: OmniBox Dual Android APK

on:
  push:
    branches: ["dasteyar-apk-build"]
    paths:
      - "dasteyar-build/**"
      - ".github/workflows/dasteyar-apk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build both debug APKs
        working-directory: dasteyar-build
        run: gradle :app:assembleOmniboxDebug :app:assembleKetabkhaneDebug --stacktrace
      - name: Prepare named APKs
        run: |
          mkdir -p output
          cp dasteyar-build/app/build/outputs/apk/omnibox/debug/app-omnibox-debug.apk output/OmniBox-v1.3.0.apk
          cp dasteyar-build/app/build/outputs/apk/ketabkhane/debug/app-ketabkhane-debug.apk output/Ketabkhane-v1.3.0.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: OmniBox-and-Ketabkhane-v1.3.0
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
