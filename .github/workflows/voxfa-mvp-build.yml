name: VoxFa v1.9 Touch Fastpath Build

on:
  workflow_dispatch:
  push:
    branches: ["voxfa-v1.9-touch-fastpath"]
    paths:
      - "voxfa-v1.9.patch"
      - ".github/workflows/voxfa-mvp-build.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified VoxFa v1.8 base artifact
        uses: actions/download-artifact@v4
        with:
          name: VoxFa-v1.8.0-GboardSymbols
          path: base-artifact
          github-token: ${{ github.token }}
          repository: ahbe0911-cmd/Ahbe123
          run-id: 33329112209

      - name: Reconstruct and patch VoxFa v1.9 source
        shell: bash
        run: |
          set -euo pipefail
          test -s base-artifact/VoxFa-v1.8.0-source.zip
          test -s voxfa-v1.9.patch
          rm -rf voxfa-project
          mkdir -p voxfa-project
          unzip -q base-artifact/VoxFa-v1.8.0-source.zip -d voxfa-project
          (cd voxfa-project && patch -p1 < ../voxfa-v1.9.patch)

      - name: Verify v1.9 touch fastpath
        shell: bash
        run: |
          set -euo pipefail
          test -f voxfa-project/settings.gradle.kts
          test -f voxfa-project/app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 10' voxfa-project/app/build.gradle.kts
          grep -q 'versionName = "1.9.0-touch-fastpath"' voxfa-project/app/build.gradle.kts
          grep -q 'native touch/click pipeline' voxfa-project/app/src/main/java/ir/voxfa/keyboard/VoiceImeServicePro.kt
          grep -q 'postDelayed(suggestionRefreshRunnable, 160L)' voxfa-project/app/src/main/java/ir/voxfa/keyboard/VoiceImeServicePro.kt
          grep -q 'lastRmsUiAt' voxfa-project/app/src/main/java/ir/voxfa/keyboard/VoiceImeServicePro.kt
          grep -q 'HandlerThread("VoxFa-Audio"' voxfa-project/app/src/main/java/ir/voxfa/keyboard/KeyboardAudioFeedback.kt
          grep -q 'gboardSymbolsPage1' voxfa-project/app/src/main/java/ir/voxfa/keyboard/KeyboardLayouts.kt
          grep -q 'speechWatchdogRunnable' voxfa-project/app/src/main/java/ir/voxfa/keyboard/VoiceImeServicePro.kt

      - name: Fetch Vazirmatn font and license
        run: bash voxfa-project/scripts/fetch-vazirmatn.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p voxfa-project --no-daemon clean assembleDebug

      - name: Verify and stage outputs
        shell: bash
        run: |
          set -euo pipefail
          APK=voxfa-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/VoxFa-v1.9.0-TouchFastpath.apk
          sha256sum release/VoxFa-v1.9.0-TouchFastpath.apk | tee release/SHA256.txt
          rm -rf voxfa-project/app/build voxfa-project/.gradle voxfa-project/.kotlin voxfa-project/app/src/main/res/font
          (cd voxfa-project && zip -qr ../release/VoxFa-v1.9.0-source.zip .)
          (cd voxfa-project && tar -cJf ../release/VoxFa-v1.9.0-source.tar.xz .)
          test -s release/VoxFa-v1.9.0-source.zip
          test -s release/VoxFa-v1.9.0-source.tar.xz

      - name: Upload installable APK and source
        uses: actions/upload-artifact@v4
        with:
          name: VoxFa-v1.9.0-TouchFastpath
          path: |
            release/VoxFa-v1.9.0-TouchFastpath.apk
            release/VoxFa-v1.9.0-source.zip
            release/VoxFa-v1.9.0-source.tar.xz
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30
