name: VoxFa Android Build

on:
  workflow_dispatch:
  push:
    branches: ["voxfa-mvp-build", "voxfa-v1.3-continuous"]
    paths:
      - "voxfa-project/**"
      - ".github/workflows/voxfa-mvp-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize VoxFa 1.3 sources
        if: github.ref_name == 'voxfa-v1.3-continuous'
        run: python3 voxfa-project/scripts/materialize-v13.py

      - name: Verify source tree
        run: |
          test -f voxfa-project/settings.gradle.kts
          test -f voxfa-project/app/src/main/AndroidManifest.xml
          test -f voxfa-project/app/src/main/java/ir/voxfa/keyboard/VoiceImeService.kt
          test -f voxfa-project/scripts/fetch-vazirmatn.sh

      - name: Fetch Vazirmatn font and license
        run: bash voxfa-project/scripts/fetch-vazirmatn.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p voxfa-project --no-daemon clean assembleDebug

      - name: Verify and stage outputs
        run: |
          APK=voxfa-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p release
          if [ "${GITHUB_REF_NAME}" = "voxfa-v1.3-continuous" ]; then
            OUT_APK=VoxFa-v1.3.0-Continuous.apk
            OUT_SRC=VoxFa-v1.3.0-source.zip
          else
            OUT_APK=VoxFa-v1.2.0-Vivid.apk
            OUT_SRC=VoxFa-v1.2.0-source.zip
          fi
          cp "$APK" "release/$OUT_APK"
          sha256sum "release/$OUT_APK" | tee release/SHA256.txt
          rm -rf voxfa-project/app/build voxfa-project/.gradle voxfa-project/app/src/main/res/font
          zip -qr "release/$OUT_SRC" voxfa-project
          test -s "release/$OUT_SRC"

      - name: Upload installable APK and source
        uses: actions/upload-artifact@v4
        with:
          name: VoxFa-${{ github.ref_name }}
          path: |
            release/*.apk
            release/*-source.zip
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30
