              <string name="onboarding_title_3">اصلاح، فیلتر و ذخیره</string>
              <string name="onboarding_desc_3">گوشه‌ها و نسبت تصویر را دقیق کنید، فیلتر مناسب بزنید و نتیجه را ذخیره یا اشتراک‌گذاری کنید.</string>
