name: ScanYar Pro Quality Build

on:
  push:
    branches:
      - scanyar-pro-quality-base
    paths:
      - '.github/workflows/scanyar-pro-quality.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout build host
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Clone proven scanner base
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Artemarius/DocShot.git scanyar-pro
          cd scanyar-pro
          git rev-parse HEAD | tee ../UPSTREAM_COMMIT.txt
          cp LICENSE ../DOCSHOT_LICENSE.txt

      - name: Apply ScanYar Pro product patch
        shell: bash
        run: |
          cd scanyar-pro
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          s = s.replace('applicationId = "com.docshot"', 'applicationId = "ir.scanyar.pro"')
          s = s.replace('versionCode = 3000014', 'versionCode = 4000001')
          s = s.replace('versionName = "1.3.2"', 'versionName = "0.2.0"')
          s = s.replace('isUniversalApk = false', 'isUniversalApk = true')
          gradle.write_text(s)

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = m.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_scanyar"')
          m = m.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/ic_scanyar"')
          m = m.replace('android:authorities="com.docshot.fileprovider"', 'android:authorities="${applicationId}.fileprovider"')
          manifest.write_text(m)
          PY

          mkdir -p app/src/main/res/drawable app/src/main/res/raw
          cat > app/src/main/res/drawable/ic_scanyar.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#175CD3" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M31,22h35l13,13v51h-48z"/>
              <path android:fillColor="#DCE9FF" android:pathData="M66,22v14h13z"/>
              <path android:fillColor="#175CD3" android:pathData="M20,30h7v-7h12v5h-7v7h-12zM81,30h7v-7h-12v5h7v7h5zM20,78h7v7h12v-5h-7v-7h-12zM81,78h7v7h-12v-5h7v-7h5z"/>
              <path android:fillColor="#94B9F8" android:pathData="M40,47h30v4h-30zM40,57h30v4h-30zM40,67h23v4h-23z"/>
          </vector>
          EOF

          cat > app/src/main/res/raw/third_party_licenses.txt <<'EOF'
          ScanYar Pro quality base includes software derived from DocShot.
          DocShot copyright and license are preserved under the MIT License.
          Original project: Artemarius/DocShot.

          MIT License
          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, subject to inclusion of the copyright and permission notice.
          EOF

