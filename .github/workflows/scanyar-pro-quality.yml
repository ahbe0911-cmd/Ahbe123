      - name: Cache OpenCV Android SDK
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: ~/opencv-android-sdk
          key: opencv-android-4.12.0

      - name: Download OpenCV Android SDK
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.12.0/opencv-4.12.0-android-sdk.zip -O /tmp/opencv.zip
          unzip -q /tmp/opencv.zip -d ~/opencv-android-sdk
          rm /tmp/opencv.zip

      - name: Build and run unit tests
        shell: bash
        run: |
          cd scanyar-pro
          chmod +x gradlew
          export OPENCV_ANDROID_SDK="$HOME/opencv-android-sdk/OpenCV-android-sdk"
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p out
          find scanyar-pro/app/build/outputs/apk/debug -type f -name '*.apk' -print -exec cp {} out/ \;
          cp UPSTREAM_COMMIT.txt DOCSHOT_LICENSE.txt out/
          cd scanyar-pro
          git diff > ../out/SCANYAR_PATCH.diff
          cd ..
          tar --exclude='.git' -czf out/ScanYar-Pro-0.2.0-source.tar.gz scanyar-pro
          ls -lah out
          sha256sum out/*.apk | tee out/APK-SHA256.txt

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: ScanYar-Pro-0.2.0-Quality-Base
          path: out/*
          if-no-files-found: error
          retention-days: 30
