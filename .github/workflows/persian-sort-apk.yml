name: Build Persian Sort APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'persian-sort-app/**'
      - '.github/workflows/persian-sort-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply compile fix
        run: |
          sed -i 's/^            setTextColor(text)$/            setTextColor(this@MainActivity.text)/' persian-sort-app/app/src/main/kotlin/com/ahmad/persiansort/MainActivity.kt
          grep -n 'setTextColor(this@MainActivity.text)' persian-sort-app/app/src/main/kotlin/com/ahmad/persiansort/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p persian-sort-app :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p out
          cp persian-sort-app/app/build/outputs/apk/debug/app-debug.apk out/PersianSort-v1.0.0.apk
          sha256sum out/PersianSort-v1.0.0.apk | tee out/PersianSort-v1.0.0.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersianSort-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: persian-sort-v1.0.0
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            out/PersianSort-v1.0.0.apk \
            out/PersianSort-v1.0.0.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Persian Sort v1.0.0" \
            --notes "APK نصب‌شدنی برنامه مقایسه و مرتب‌سازی حروف و کلمات فارسی"
