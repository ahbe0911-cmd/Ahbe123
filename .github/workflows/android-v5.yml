name: Rooznegar Android Build APK

on:
  push:
    paths:
      - 'payload5/**'
      - '.github/workflows/android-v5.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve optional source overlay
        run: |
          if [ -d rooznegar-android ]; then
            mkdir -p /tmp/rooznegar-overlay
            cp -R rooznegar-android/. /tmp/rooznegar-overlay/
          fi

      - name: Restore source project
        run: |
          cat payload5/part00 payload5/part01 payload5/part02 payload5/part03 payload5/part04 payload5/part05 > project.b64
          test "$(wc -c < project.b64)" -eq 27852
          base64 -d project.b64 > project.tgz
          gzip -t project.tgz
          tar -xzf project.tgz
          if [ -d /tmp/rooznegar-overlay ]; then
            rsync -a /tmp/rooznegar-overlay/ rooznegar-android/
          fi
          test -f rooznegar-android/app/build.gradle.kts

      - name: Add Vazirmatn fonts when requested by redesign
        run: |
          THEME=rooznegar-android/app/src/main/java/ir/rooznegar/app/ui/theme/Theme.kt
          if grep -q 'vazirmatn_regular' "$THEME"; then
            mkdir -p rooznegar-android/app/src/main/res/font
            curl -L --fail --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-Regular.ttf -o rooznegar-android/app/src/main/res/font/vazirmatn_regular.ttf
            curl -L --fail --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-Medium.ttf -o rooznegar-android/app/src/main/res/font/vazirmatn_medium.ttf
            curl -L --fail --retry 3 https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/ttf/Vazirmatn-Bold.ttf -o rooznegar-android/app/src/main/res/font/vazirmatn_bold.ttf
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build debug APK
        working-directory: rooznegar-android
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare APK
        run: cp rooznegar-android/app/build/outputs/apk/debug/app-debug.apk Rooznegar-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rooznegar-debug-apk
          path: Rooznegar-debug.apk
          if-no-files-found: error
