name: ScanYar Pro v2 Engine

on:
  push:
    branches: [scanyar-pro-v2-engine]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
      ABIS: arm64-v8a
      SOURCE_DATE_EPOCH: 1700000000
      TZ: UTC
      LC_ALL: C
      LANG: C
      PYTHONHASHSEED: 0
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Checkout pinned MakeACopy engine
        run: |
          git clone --recursive https://github.com/egdels/makeacopy.git engine
          cd engine
          git checkout 46c82db27b93e58921e8904b33f5096e2115c650
          git submodule update --init --recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.11.2
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Set up CMake 3.31.6
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'

      - name: Prepare deterministic native build
        run: |
          python3 -m pip install --upgrade pip flatbuffers
          echo "BUILD_GENERATOR=Unix Makefiles" >> $GITHUB_ENV
          echo "ORT_CMAKE=$(which cmake)" >> $GITHUB_ENV
          echo "OPENCV_CMAKE=$(which cmake)" >> $GITHUB_ENV
          echo "PY3_BIN=$(which python3)" >> $GITHUB_ENV

      - name: Apply ScanYar Pro product layer
        run: |
          cd engine
          sed -i 's/applicationId "de.schliweb.makeacopy"/applicationId "ir.scanyar.pro"/' app/build.gradle
          sed -i 's/<string name="app_name">MakeACopy<\/string>/<string name="app_name">ScanYar Pro<\/string>/' app/src/main/res/values/strings.xml
          mkdir -p app/src/main/res/values-fa
          cat > app/src/main/res/values-fa/strings.xml <<'EOF'
          <resources>
              <string name="app_name">اسکن‌یار پرو</string>
              <string name="title_camera">دوربین</string>
              <string name="title_crop">برش</string>
              <string name="title_ocr">تشخیص متن</string>
              <string name="title_export">خروجی</string>
              <string name="btn_scan">اسکن</string>
              <string name="btn_crop">برش</string>
              <string name="btn_process">پردازش</string>
              <string name="btn_share">اشتراک‌گذاری</string>
              <string name="btn_pick_image">انتخاب تصویر</string>
              <string name="add_another_page">افزودن صفحه</string>
              <string name="clear_all_pages">پاک کردن همه</string>
              <string name="document_cleanup_original">اصلی</string>
              <string name="document_cleanup_natural">طبیعی</string>
              <string name="document_cleanup_enhanced">تقویت‌شده</string>
              <string name="document_cleanup_clean_text">متن تمیز</string>
              <string name="export_format_label">فرمت خروجی</string>
              <string name="pdf_quality_title">کیفیت / حجم PDF</string>
              <string name="btn_save">ذخیره</string>
              <string name="btn_new">اسکن جدید</string>
              <string name="btn_review">بازبینی</string>
          </resources>
          EOF
          printf '\nScanYar Pro v2 engine preview: product-layer modifications by the ScanYar project. Upstream MakeACopy and third-party notices are retained.\n' >> NOTICE

      - name: Build OpenCV 4.13 native
        run: |
          cd engine
          chmod +x scripts/build_opencv_android.sh scripts/prepare_opencv.sh
          REQUIRE_PINNED_JNI=1 ./scripts/build_opencv_android.sh
          ./scripts/prepare_opencv.sh

      - name: Build reduced ONNX Runtime for DocQuad
        run: |
          cd engine
          chmod +x scripts/build_onnxruntime_android.sh
          ./scripts/build_onnxruntime_android.sh

      - name: Build installable arm64 debug APK
        run: |
          cd engine
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleStandardDebug -Pedition=full -PenableAbiSplits=true -PABIS=arm64-v8a
          mkdir -p ../out
          APK=$(find app/build/outputs/apk/standard/debug -name '*arm64-v8a*debug.apk' -o -name '*debug.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" ../out/ScanYar-Pro-v2-engine-preview-arm64.apk
          sha256sum ../out/ScanYar-Pro-v2-engine-preview-arm64.apk > ../out/ScanYar-Pro-v2-engine-preview-arm64.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanYar-Pro-v2-Engine-Preview
          path: out/*
          if-no-files-found: error
