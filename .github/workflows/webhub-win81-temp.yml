name: WebHub Windows 8.1 Build

on:
  pull_request:
    branches: [main]
    paths:
      - "webhub-temp/**"
      - ".github/workflows/webhub-win81-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-webhub:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build WebHub x64
        shell: pwsh
        run: |
          msbuild "webhub-temp\WebHubWin81\WebHubWin81.csproj" /restore /t:Build /p:Configuration=Release /p:Platform=x64 /m

      - name: Verify CEF runtime
        shell: pwsh
        run: |
          $out = "webhub-temp\WebHubWin81\bin\Release\net472"
          if (-not (Test-Path "$out\WebHub.exe")) { throw "WebHub.exe not found" }
          if (-not (Test-Path "$out\libcef.dll")) { throw "libcef.dll not found" }

      - name: Download VC++ runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/16/release/vc_redist.x64.exe" -OutFile "webhub-temp\installer\vc_redist.x64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc "webhub-temp\installer\WebHubWin81.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WebHub-Windows-8.1-x64-Setup
          path: release/WebHub-Windows-8.1-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
